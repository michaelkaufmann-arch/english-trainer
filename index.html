<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="English Trainer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f6f4">
<link rel="manifest" href="manifest.json?v=5">
<link rel="apple-touch-icon" href="icon-180.png?v=5">
<title>English Trainer</title>
<style>
:root{--bg:#f6f6f4;--surface:#fff;--soft:#f5f4f0;--line:#e5e3de;--ink:#171717;--muted:#85837e;--bad:#f9e8e6;--good:#e5f3ea}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}
body{min-height:100vh}.shell{max-width:1180px;margin:0 auto;padding:28px 20px 42px}.layout{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:start}.sidebar{text-align:center;padding-top:8px}.appicon{width:94px;height:94px;border-radius:24px;display:block;margin:0 auto 10px;box-shadow:0 8px 22px #00000012}.appname{font-size:15px;font-weight:650}.side-label{margin-top:22px;color:#0c4b4a;background:#e6eeeb;border-radius:18px;padding:12px 8px;font-size:12px;line-height:1.25}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 14px 40px #0000000b}.quiz{padding:28px 28px 30px}.top{display:flex;justify-content:space-between;align-items:center}.pill{font-size:13px;color:#777;background:#f2f1ed;border:1px solid #e8e6e0;padding:8px 12px;border-radius:999px}.word{font-size:58px;line-height:1.05;font-weight:750;letter-spacing:-.045em;text-align:center;margin:52px 0 28px}.answer{background:#f7f6f2;border-radius:20px;padding:22px 24px;text-align:center;font-size:30px;font-weight:650;min-height:78px;display:flex;align-items:center;justify-content:center}.answer.hidden{display:none}
.speak{display:flex;align-items:center;justify-content:center;width:78px;height:78px;padding:0;margin:16px auto 26px;border:0;background:#fff;border-radius:50%;box-shadow:0 5px 18px #00000012}.speak img{width:68px;height:68px;display:block}.choices{background:var(--soft);border-radius:20px;overflow:hidden;margin-top:18px}.choice{width:100%;border:0;border-bottom:1px solid #e4e2dc;background:transparent;text-align:left;padding:22px 20px;display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:650;color:#191919}.choice:last-child{border-bottom:0}.choice.selected{background:#e9eee9}.level{font-size:12px;color:#555;background:#ecebe7;border:1px solid #e2e0da;border-radius:999px;padding:7px 10px;font-weight:600}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.actions button{border:0;border-radius:17px;padding:17px;font-size:17px;font-weight:600}.wrong{background:var(--bad);color:#8a332c}.right{background:var(--good);color:#24603b}.new{width:100%;margin-top:14px;border:0;border-radius:17px;background:#e9e8e4;padding:16px;font-size:17px;color:#222}
.settings{margin-top:14px;padding:17px 20px}.settings summary{cursor:pointer;font-size:16px;font-weight:650;list-style:none}.settings summary::-webkit-details-marker{display:none}.settings summary:before{content:"▾";margin-right:10px;font-size:14px}.settings-body{padding-top:14px}.settings label{font-size:14px;font-weight:650;display:block;margin-bottom:7px}.settings input{width:100%;padding:12px;border:1px solid #d8d6d1;border-radius:12px;background:#fff}.loading{padding:26px}.status{margin-top:14px;color:#8a8883;font-size:12px;text-align:center}.error{color:#9a3028}
@media(max-width:760px){.shell{padding:14px}.layout{grid-template-columns:1fr}.sidebar{display:flex;align-items:center;gap:12px;text-align:left}.appicon{width:58px;height:58px;border-radius:16px;margin:0}.side-label{display:none}.quiz{padding:20px 16px}.word{font-size:44px;margin:38px 0 22px}.answer{font-size:24px}.choice{font-size:17px;padding:18px 15px}}
</style>
</head>
<body>
<div class="shell">
<div class="layout">
<aside class="sidebar">
<img class="appicon" src="icon-180.png?v=5" alt="English Trainer">
<div class="appname">English Trainer</div>
</aside>
<main>
<div id="loading" class="card loading"><b>Grundwortschatz wird geladen …</b><p>Beim ersten Start werden die 1.500 Vokabeln geladen.</p></div>
<div id="app" style="display:none">
<section class="card quiz">
<div class="top"><span class="pill" id="counter">1 / 20</span><span class="pill">A1–B2</span></div>
<div class="word" id="word">—</div>
<div class="answer hidden" id="answer">—</div>
<button class="speak" id="speak" aria-label="Englisches Wort anhören"><img src="sound-icon.svg" alt="Aussprache"></button>
<div class="choices" id="choices"></div>
<div class="actions"><button class="wrong" id="wrong">✕ Falsch</button><button class="right" id="right">✓ Richtig</button></div>
</section>
<button class="new" id="newSession">Neue Runde</button>
<details class="card settings">
<summary>Einstellungen &amp; Fortschritt</summary>
<div class="settings-body"><label for="sessionSize">Wörter pro Runde</label><input id="sessionSize" type="number" min="5" max="50" value="20"><div class="status" id="status"></div></div>
</details>
</div>
</main>
</div>
</div>
<script>
const SOURCE="https://raw.githubusercontent.com/giniedp/media_education/master/drehbuch/doc/resources/vocabulary/more/Vokabellisten_Englisch/Deutsch%20-%20Englisch%20Grundwortschatz%20%5B1681%5D.csv";
const LIMIT=1500, VOCAB_KEY="en_vocab_1500_v1", STATE_KEY="en_vocab_state_v2";
let vocab=[],state={},session=[],pos=0,selected=null,selectedVoice=null;
const $=id=>document.getElementById(id);
function parseCSV(text){return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,LIMIT).map((line,i)=>{const k=line.indexOf(';');if(k<0)return null;let de=line.slice(0,k).trim(),en=line.slice(k+1).trim();de=de.split(',')[0].trim();en=en.split(',')[0].trim();en=en.replace(/^to be allowed to,.*$/,'to be allowed to');return de&&en?{id:i,de,en}:null}).filter(Boolean)}
function save(){localStorage.setItem(STATE_KEY,JSON.stringify(state))}function loadState(){try{state=JSON.parse(localStorage.getItem(STATE_KEY)||'{}')}catch(e){state={}}}function initState(){vocab.forEach(v=>{if(!state[v.id])state[v.id]={seen:0,streak:0,due:0}});save()}
function pick(used){let now=Date.now(),c=vocab.filter(v=>!used.has(v.id)&&state[v.id].due<=now);if(!c.length)c=vocab.filter(v=>!used.has(v.id));return c[Math.floor(Math.random()*c.length)]}
function makeSession(){let n=Math.max(5,Math.min(50,parseInt($('sessionSize').value)||20));session=[];let used=new Set();while(session.length<n&&used.size<vocab.length){let v=pick(used);if(!v)break;used.add(v.id);session.push(v)}pos=0;selected=null;render()}
function makeChoices(correct){let set=new Set([correct]),pool=vocab.filter(v=>v.en!==correct);while(set.size<3&&pool.length){set.add(pool.splice(Math.floor(Math.random()*pool.length),1)[0].en)}return [...set].sort(()=>Math.random()-.5)}
function render(){if(pos>=session.length){$('counter').textContent='✓ Fertig';$('word').textContent='Runde abgeschlossen';$('answer').classList.add('hidden');$('speak').style.display='none';$('choices').innerHTML='';$('status').textContent='';return}let v=session[pos];selected=null;$('counter').textContent=(pos+1)+' / '+session.length;$('word').textContent=v.de;$('answer').textContent=v.en;$('answer').classList.add('hidden');$('speak').style.display='none';$('choices').innerHTML='';makeChoices(v.en).forEach((text,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<span>'+text+'</span><span class="level">B1</span>';b.onclick=()=>{selected=text;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('answer').classList.remove('hidden');$('speak').style.display='flex'};$('choices').appendChild(b)});$('status').textContent=''}
function chooseVoice(){let voices=speechSynthesis.getVoices().filter(v=>/^en-GB/i.test(v.lang||''));const female=/kate|martha|serena|fiona|susan|samantha|hazel|female|woman/i;const male=/daniel|alex|fred|ralph|tom|oliver|george|male|man/i;selectedVoice=voices.find(v=>female.test(v.name)&&!male.test(v.name))||voices.find(v=>!male.test(v.name))||voices[0]||null;return selectedVoice}
function speak(){let v=session[pos];if(!v)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(v.en),voice=chooseVoice();u.voice=voice||null;u.lang=voice?.lang||'en-GB';u.rate=.82;u.pitch=.98;speechSynthesis.speak(u)}
function rate(ok){if(!session[pos])return;let v=session[pos],s=state[v.id],now=Date.now();s.seen++;if(ok){s.streak++;let ints=[1,3,7,14,30,60,120];s.due=now+ints[Math.min(s.streak-1,ints.length-1)]*86400000}else{s.streak=0;s.due=now+20*60000}save();pos++;render()}
async function start(){loadState();try{let cached=localStorage.getItem(VOCAB_KEY);if(cached)vocab=JSON.parse(cached);if(vocab.length<LIMIT){let r=await fetch(SOURCE,{cache:'no-store'});if(!r.ok)throw Error('Quelle nicht erreichbar');vocab=parseCSV(await r.text());localStorage.setItem(VOCAB_KEY,JSON.stringify(vocab))}if(vocab.length<100){throw Error('Vokabelliste konnte nicht geladen werden')}initState();$('loading').style.display='none';$('app').style.display='block';makeSession()}catch(e){$('loading').innerHTML='<b>Vokabeln konnten nicht geladen werden.</b><p class="error">'+e.message+'</p>'}}
$('speak').onclick=speak;$('wrong').onclick=()=>rate(false);$('right').onclick=()=>rate(true);$('newSession').onclick=makeSession;speechSynthesis.onvoiceschanged=chooseVoice;chooseVoice();start();
</script>
</body></html>
